/* Раскладка: шапка, прокручиваемый экран, нижняя панель. Одна тёмная тема.
   Цвет кодирует вид нарушения одинаково на всех схемах: нервы — янтарь, парез — коралл,
   чувствительность — синий, атаксия — зелёный, зрение — сирень; очаг — красный пунктир. */
:root {
  --bg: #0F1113; --surface: #181B1F; --surface-2: #20242A; --border: #2C3138;
  --text: #ECEEF0; --text-2: #A3AAB3;
  --fig: #2A2F36; --fig-line: #3E4550;
  --k-nerve: #F2B45C; --k-motor: #F07C6C; --k-sens: #6EA8F2; --k-atax: #86CF7E; --k-vis: #BFA6F5;
  --lesion: #FF5A4E;
  --lv-mid: #BFA6F5; --lv-pons: #5CCBC0; --lv-med: #F08FB6;
  --t-aca: #5CCBC0; --t-mca-sup: #F2B45C; --t-mca-inf: #E58548; --t-mca-deep: #FFE09A; --t-pca: #A98BEA; --t-acha: #F08FB6;
  --ok: #8FD19A; --ok-fill: #17331D; --bad: #F09A90; --bad-fill: #451C1A;
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --k: 1;
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html {
  font-size: calc(110% * var(--k));
  height: 100%;
  padding: env(safe-area-inset-top, 0px) 0 env(safe-area-inset-bottom, 0px);
  background: var(--bg);
  -webkit-text-size-adjust: 100%;
  -webkit-tap-highlight-color: transparent;
}
body {
  margin: 0; height: 100%;
  display: flex; flex-direction: column; overflow: hidden;
  background: var(--bg); color: var(--text);
  font: 600 1.0625rem/1.45 var(--sans);
}
button { font: inherit; color: inherit; cursor: pointer; }
p, li, span, b { overflow-wrap: break-word; }
.sym li, .r4 li, .struct li, .compare p { hyphens: auto; -webkit-hyphens: auto; }
button:focus-visible, summary:focus-visible { outline: 2px solid var(--text); outline-offset: 2px; }
h1, h2, h3, p, ul, ol { margin: 0; }
ul, ol { padding: 0; list-style: none; }
h1, h2, h3 { text-wrap: balance; }
.wrap { width: 100%; max-width: 600px; margin-inline: auto; }
.stack { display: flex; flex-direction: column; gap: 14px; }

.top {
  flex: none; height: 3.25rem;
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding-inline: max(16px, env(safe-area-inset-left, 0px)) max(8px, env(safe-area-inset-right, 0px));
  border-bottom: 1px solid var(--border);
}
.top h1 { font-size: 1.25rem; font-weight: 800; letter-spacing: .01em; display: flex; align-items: center; gap: 8px; }
.top h1 .dotlogo { width: 12px; height: 12px; border-radius: 50%; background: var(--lesion); }
.top .sub { color: var(--text-2); font-size: .875rem; }
main {
  flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; -webkit-overflow-scrolling: touch;
  padding: 16px max(16px, env(safe-area-inset-right, 0px)) 28px max(16px, env(safe-area-inset-left, 0px));
}
.tabs {
  flex: none; display: grid; grid-template-columns: repeat(4, 1fr);
  border-top: 1px solid var(--border); background: var(--surface);
  padding-inline: env(safe-area-inset-left, 0px) env(safe-area-inset-right, 0px);
}
.tab {
  min-height: 62px; border: 0; background: none; padding: 6px 2px;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
  color: var(--text-2); font-size: .8125rem; font-weight: 700;
}
.tab .ti { font-size: 1.25rem; line-height: 1; padding: 4px 14px; border-radius: 999px; }
.tab[aria-current="page"] { color: var(--text); }
.tab[aria-current="page"] .ti { background: var(--border); }

.card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.card h2 { font-size: 1.25rem; font-weight: 800; line-height: 1.25; }
.card h3 { font-size: 1.0625rem; font-weight: 800; }
.eyebrow { font-size: .75rem; font-weight: 800; letter-spacing: .09em; text-transform: uppercase; color: var(--text-2); }
.muted { color: var(--text-2); }
.small { font-size: .9375rem; }
.lead { color: var(--text-2); }
.diagram { width: 100%; height: auto; display: block; }
.svgtext { font-family: var(--sans); font-weight: 700; }

.back {
  align-self: flex-start; min-height: 48px; padding: 0 12px 0 2px; margin-left: -2px;
  border: 0; background: none; color: var(--text-2); font-size: 1rem;
}
.title-block { display: flex; flex-direction: column; gap: 6px; }
.title-block h2 { font-size: 1.625rem; font-weight: 800; line-height: 1.15; }
.chip-row { display: flex; flex-wrap: wrap; gap: 6px; }
.lv {
  display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px;
  font-size: .875rem; font-weight: 800; border: 1px solid var(--c); color: var(--c);
}
.lv::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--c); }

/* Списки синдромов */
.level-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; padding: 4px 2px 0; }
.level-head h2 { font-size: 1.125rem; font-weight: 800; color: var(--c); }
.level-head span { color: var(--text-2); font-size: .9375rem; }
.rows { display: flex; flex-direction: column; gap: 8px; }
.row {
  width: 100%; min-height: 64px; text-align: left; border: 1px solid var(--border); border-left: 4px solid var(--c);
  background: var(--surface); border-radius: 14px; padding: 10px 12px 10px 14px;
  display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: center;
}
.row > div { min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.row b { font-size: 1.0625rem; }
.row span.b { color: var(--text-2); font-size: .9375rem; font-weight: 600; }
.row .chev { color: var(--text-2); font-size: 1.5rem; }

/* Списки симптомов */
.sym { display: flex; flex-direction: column; gap: 8px; }
.sym li { display: grid; grid-template-columns: 14px 1fr; gap: 10px; align-items: start; }
.sym li::before { content: ""; width: 12px; height: 12px; border-radius: 3px; margin-top: .4em; background: var(--c, var(--text-2)); }
.side-h { display: flex; align-items: center; gap: 8px; font-size: .9375rem; font-weight: 800; color: var(--text-2); text-transform: uppercase; letter-spacing: .06em; }
.side-h .pin { width: 10px; height: 10px; border-radius: 50%; border: 2px solid var(--lesion); }
.side-h .pin.fill { background: var(--lesion); }
.note { border-left: 3px solid var(--text-2); padding: 2px 0 2px 12px; color: var(--text); }
.memo { background: var(--surface-2); border-radius: 12px; padding: 12px 14px; display: flex; gap: 10px; }
.memo .i { flex: none; }

.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: .875rem; color: var(--text-2); }
.legend.v { flex-direction: column; gap: 8px; }
.legend span { line-height: 1.25; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 12px; height: 12px; border-radius: 3px; background: var(--c); display: inline-block; }
.legend i.lesion { border-radius: 50%; background: transparent; border: 2px dashed var(--lesion); }
.sides { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; text-align: center; font-size: .8125rem; color: var(--text-2); font-weight: 800; text-transform: uppercase; letter-spacing: .05em; }
.sides .les { color: var(--lesion); }

.struct { display: flex; flex-direction: column; gap: 6px; }
.struct li { display: grid; grid-template-columns: 26px 1fr; gap: 10px; align-items: start; font-size: .9375rem; opacity: .5; }
.struct li.hit { opacity: 1; }
.struct .num { width: 24px; height: 24px; border-radius: 50%; border: 1px solid var(--text-2); display: inline-flex; align-items: center; justify-content: center; font-size: .75rem; font-weight: 800; }
.struct li.hit .num { background: var(--c); border-color: var(--c); color: var(--bg); }
.struct li.hit b { color: var(--c); }

.patient { display: grid; grid-template-columns: minmax(0, 42%) minmax(0, 1fr); gap: 16px; align-items: center; }
.patient .col { display: flex; flex-direction: column; gap: 10px; min-width: 0; }

.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; border: 1px solid var(--border); border-radius: 14px; overflow: hidden; background: var(--surface); }
.seg button { min-height: 48px; border: 0; background: none; color: var(--text-2); font-size: .9375rem; font-weight: 800; padding: 4px; }
.seg button + button { border-left: 1px solid var(--border); }
.seg button[aria-pressed="true"] { background: var(--text); color: var(--bg); }

.terr-legend { display: flex; flex-wrap: wrap; gap: 6px; }
.terr-legend span { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px; border: 1px solid var(--border); font-size: .8125rem; color: var(--text-2); }
.terr-legend span i { width: 10px; height: 10px; border-radius: 50%; background: var(--c); }
.terr-legend span.on { color: var(--text); border-color: var(--c); }

.compare { display: grid; grid-template-columns: 1fr; gap: 10px; }
.compare > div { background: var(--surface-2); border-radius: 12px; padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; }
.compare h3 { font-size: 1rem; }
.steps { display: flex; flex-direction: column; gap: 10px; counter-reset: s; }
.steps li { display: grid; grid-template-columns: 30px 1fr; gap: 10px; align-items: start; }
.steps li::before { counter-increment: s; content: counter(s); width: 28px; height: 28px; border-radius: 50%; background: var(--surface-2); border: 1px solid var(--border); display: inline-flex; align-items: center; justify-content: center; font-size: .875rem; font-weight: 800; }
.r4 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.r4 > div { background: var(--surface-2); border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.r4 h3 { font-size: 1rem; }
.r4 li { font-size: .9375rem; }
.r4 li b { color: var(--c); font-size: 1.0625rem; }
details.more { border: 1px solid var(--border); border-radius: 16px; background: var(--surface); }
details.more summary { min-height: 56px; padding: 0 16px; display: flex; align-items: center; justify-content: space-between; cursor: pointer; font-weight: 800; list-style: none; }
details.more summary::-webkit-details-marker { display: none; }
details.more summary::after { content: "▾"; color: var(--text-2); }
details.more[open] summary::after { content: "▴"; }
details.more > div { padding: 0 16px 16px; display: flex; flex-direction: column; gap: 10px; }

/* Тест */
.btn {
  min-height: 56px; width: 100%; border-radius: 14px; border: 1px solid var(--text);
  background: var(--text); color: var(--bg); font-weight: 800; font-size: 1.0625rem; padding: 8px 16px;
}
.qhead { display: flex; justify-content: space-between; color: var(--text-2); font-size: .9375rem; font-variant-numeric: tabular-nums; }
.bar { height: 6px; background: var(--border); border-radius: 3px; overflow: hidden; }
.bar b { display: block; height: 100%; background: var(--text-2); }
.case { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 14px 16px; display: flex; flex-direction: column; gap: 8px; }
.case p b { color: var(--k-nerve); }
.qtext { font-size: 1.25rem; font-weight: 800; line-height: 1.3; }
.opts { display: flex; flex-direction: column; gap: 8px; }
.opt { min-height: 56px; width: 100%; text-align: left; padding: 10px 16px; border-radius: 14px; border: 1px solid var(--border); background: var(--surface); }
.opt.ok { border-color: var(--ok); background: var(--ok-fill); color: var(--ok); }
.opt.bad { border-color: var(--bad); background: var(--bad-fill); color: var(--bad); }
.opt:disabled { cursor: default; }
.opt:disabled:not(.ok):not(.bad) { opacity: .55; }
.fb.ok { color: var(--ok); } .fb.bad { color: var(--bad); }
.fb span { color: var(--text); }
.linkbtn { border: 0; background: none; color: var(--k-sens); padding: 0; min-height: 48px; text-align: left; text-decoration: underline; text-underline-offset: 3px; }
.score { text-align: center; padding: 8px 0; display: flex; flex-direction: column; gap: 4px; }
.score .num { font-size: 3.25rem; font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; }
.mist li { border: 1px solid var(--border); border-radius: 14px; background: var(--surface); padding: 12px 14px; display: flex; flex-direction: column; gap: 4px; }
.mist ul { display: flex; flex-direction: column; gap: 10px; }
.mist .y { color: var(--bad); font-size: .9375rem; }
.mist .r { color: var(--ok); font-size: .9375rem; }

@media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; animation: none !important; } }
</style>
</head>

<script>

function parseBody(spec, lesionLeft) {
  const map = {};
  (spec || '').split(/\s+/).filter(Boolean).forEach(tok => {
    const [r, kk] = tok.split(':');
    const m = r.match(/^(.*)-([ic])$/);
    const pic = (m[2] === 'i') === lesionLeft ? 'L' : 'R';
    const regs = m[1] === 'face' ? ['faceup', 'facelo'] : [m[1]];
    const mild = kk.endsWith('-');
    const ks = kk.replace('-', '').split('').map(c => KC[c]);
    regs.forEach(reg => { map[reg + '-' + pic] = { ks, mild }; });
  });
  return map;
}
function bodySVG(spec, lesionLeft) {

    const isEye = reg === 'eye' || reg === 'tongue';
    let fill = isEye ? 'var(--bg)' : 'var(--fig)';
    let op = '';
    if (st) { fill = KINDS[st.ks[0]].c; if (st.mild) op = ';fill-opacity:.45'; }

function fieldsSVG(vf, lesionLeft) {
  // Вид со стороны пациента: левая половина круга — левое поле зрения.
  const contraRight = lesionLeft; // выпадает поле, противоположное очагу
  const eye = (cx, isLesionEye) => {
    const r = 34, cy = 40;
    let lost = '';
    const halfPath = right => right ? `M${cx},${cy - r} A${r},${r} 0 0 1 ${cx},${cy + r} Z` : `M${cx},${cy - r} A${r},${r} 0 0 0 ${cx},${cy + r} Z`;
    if (vf === 'hemi' || vf === 'spare') lost = `<path d="${halfPath(contraRight)}"/>`;
    if (vf === 'quad') lost = contraRight ? `<path d="M${cx},${cy} L${cx},${cy - r} A${r},${r} 0 0 1 ${cx + r},${cy} Z"/>` : `<path d="M${cx},${cy} L${cx},${cy - r} A${r},${r} 0 0 0 ${cx - r},${cy} Z"/>`;
    if (vf === 'mono' && isLesionEye) lost = `<circle cx="${cx}" cy="${cy}" r="${r}"/>`;
    const spare = vf === 'spare' ? `<circle cx="${cx}" cy="${cy}" r="9" style="fill:var(--text-2)"/>` : '';
    return `<circle cx="${cx}" cy="${cy}" r="${r}" style="fill:var(--text-2)"/>
      <g style="fill:#0B0C0E">${lost}</g>${spare}
      <circle cx="${cx}" cy="${cy}" r="${r}" style="fill:none;stroke:var(--fig-line);stroke-width:1.5"/>
      <circle cx="${cx}" cy="${cy}" r="2.5" style="fill:var(--bg)"/>`;
  };
  return `<svg class="diagram" viewBox="0 0 200 104" role="img" aria-label="Поля зрения">
    ${eye(50, lesionLeft)}${eye(150, !lesionLeft)}
    <text x="50" y="98" text-anchor="middle" class="svgtext" style="fill:var(--text-2);font-size:12px">левый глаз</text>

function renderHemi() {

}

/* ===================== ТЕСТ ===================== */
const N_Q = 10;
const ART_OPTS = { pca: 'Задняя мозговая артерия', basilar: 'Основная (базилярная) артерия', pica: 'ЗНМА или позвоночная артерия', asa: 'Передняя спинномозговая артерия' };
function caseSides() {
  const L = Math.random() < .5;
  return { L, I: L ? 'Слева' : 'Справа', C: L ? 'Справа' : 'Слева', toI: L ? 'влево' : 'вправо', toC: L ? 'вправо' : 'влево', side: L ? 'слева' : 'справа', other: L ? 'справа' : 'слева' };
}
const fill = (t, sd) => t.replace(/\{I\}/g, sd.toI).replace(/\{C\}/g, sd.toC);
function stemCase(s, sd) {
  return `<p><b>${sd.I}:</b> ${esc(fill(s.caseI, sd))}.</p><p><b>${sd.C}:</b> ${esc(fill(s.caseC, sd))}.</p>${s.caseX ? `<p>${esc(fill(s.caseX, sd))}</p>` : ''}`;
}
function choice(caseHtml, text, right, wrong, explain) {
  const uniq = [...new Set(wrong.filter(w => w !== right))].slice(0, 3);
  return { caseHtml, text, opts: shuffle([right, ...uniq]), right, explain };
}
const QGEN = {
  stemCase() {
    const s = rand(STEM), sd = caseSides();
    const same = shuffle(STEM.filter(x => x.level === s.level && x.id !== s.id)).slice(0, 2);
    const other = shuffle(STEM.filter(x => x.level !== s.level)).slice(0, 3 - same.length);
    return { key: 'sc-' + s.id, ...choice(stemCase(s, sd), 'Какой это синдром?', s.name, [...same, ...other].map(x => x.name), { t: 'stem', id: s.id }) };
  },
  stemWhere() {
    const s = rand(STEM), sd = caseSides();
    const lv = Object.keys(LEVELS);
    const others = shuffle(lv.filter(x => x !== s.level));
    const opt = (l, side) => `${LEVELS[l].loc[0].toUpperCase()}${LEVELS[l].loc.slice(1)} ${side}`;
    return { key: 'sw-' + s.id, ...choice(stemCase(s, sd), 'Где очаг?', opt(s.level, sd.side), [opt(s.level, sd.other), opt(others[0], sd.side), opt(others[1], sd.other)], { t: 'stem', id: s.id }) };
  },
  stemLevel() {
    const s = rand(STEM);
    return { key: 'sl-' + s.id, ...choice('', `${s.name}: на каком уровне очаг?`, LEVELS[s.level].name, Object.keys(LEVELS).map(l => LEVELS[l].name), { t: 'stem', id: s.id }) };
  },
  stemArt() {
    const s = rand(STEM.filter(x => ART_OPTS[x.art]));
    return { key: 'sa-' + s.id, ...choice('', `${s.name}: какая артерия поражена чаще всего?`, ART_OPTS[s.art], Object.values(ART_OPTS), { t: 'stem', id: s.id }) };
  },
  hemiCase() {
    const h = rand(HEMI), sd = caseSides();
    const extraSide = sd.L ? h.caseL : h.caseR;
    const caseHtml = `<p><b>${sd.C}:</b> ${esc(h.caseC)}.</p>${h.caseI ? `<p><b>${sd.I}:</b> ${esc(h.caseI)}.</p>` : ''}${h.caseX ? `<p>${esc(fill(h.caseX, sd))}</p>` : ''}${extraSide ? `<p>Также: ${esc(extraSide)}.</p>` : ''}`;
    const opt = (x, side) => `${x.short} ${side}`;
    const others = shuffle(HEMI.filter(x => x.id !== h.id));
    return { key: 'hc-' + h.id, ...choice(caseHtml, 'Какой бассейн и с какой стороны очаг?', opt(h, sd.side), [opt(h, sd.other), opt(others[0], sd.side), opt(others[1], sd.other)], { t: 'hemi', id: h.id, left: sd.L }) };
  }
};
const PLAN = ['stemCase', 'stemCase', 'stemCase', 'stemWhere', 'stemWhere', 'stemLevel', 'stemArt', 'hemiCase', 'hemiCase', 'hemiCase'];
let test = null;
function buildTest() {
  const qs = [], keys = new Set();
  shuffle(PLAN).forEach(type => {
    for (let n = 0; n < 30; n++) { const q = QGEN[type](); if (!keys.has(q.key)) { keys.add(q.key); qs.push(q); break; } }
  });
  test = { qs: qs.slice(0, N_Q), i: 0, pick: null, score: 0, mistakes: [] };
}
function renderTest() {
  if (!test) buildTest();
  if (test.i >= test.qs.length) return renderResult();
  const q = test.qs[test.i], a = test.pick !== null;
  const opts = q.opts.map((o, k) => {
    let cls = '';
    if (a) { if (o === q.right) cls = 'ok'; else if (test.pick === k) cls = 'bad'; }
    return `<button class="opt ${cls}" type="button" data-act="ans" data-k="${k}"${a ? ' disabled' : ''}>${esc(o)}</button>`;
  }).join('');
  const ok = a && q.opts[test.pick] === q.right;
  main.innerHTML = `<div class="wrap stack">
    <div class="qhead"><span>Вопрос ${test.i + 1} из ${test.qs.length}</span><span>Верно: ${test.score}</span></div>
    <div class="bar" aria-hidden="true"><b style="width:${(test.i + (a ? 1 : 0)) / test.qs.length * 100}%"></b></div>
    ${q.caseHtml ? `<div class="case"><span class="eyebrow">Пациент</span>${q.caseHtml}</div>` : ''}
    <p class="qtext">${esc(q.text)}</p>
    <div class="opts">${opts}</div>
    ${a ? `<p class="fb ${ok ? 'ok' : 'bad'}">${ok ? '✓ Верно' : `✗ Неверно. <span>Правильно: ${esc(q.right)}</span>`}</p>
      <button class="linkbtn" type="button" data-act="explain">Разобрать на схеме</button>
      <button class="btn" type="button" data-act="next">${test.i === test.qs.length - 1 ? 'Результат' : 'Дальше'}</button>` : ''}
  </div>`;
}
function renderResult() {
  const n = test.qs.length;
  if (state.best === null || test.score > state.best) { state.best = test.score; saveStore(); }
  const verdict = test.score === n ? 'Без единой ошибки.' : test.score >= 7 ? 'Хороший результат.' : 'Посмотрите схемы и попробуйте ещё раз.';
  main.innerHTML = `<div class="wrap stack">
    <div class="score"><span class="num">${test.score} из ${n}</span><p class="muted">${verdict} Лучший результат: ${state.best} из ${n}.</p></div>
    ${test.mistakes.length ? `<section class="mist stack"><span class="eyebrow">Ошибки</span><ul>${test.mistakes.map(m => `<li>${m.caseText ? `<span class="small muted">${esc(m.caseText)}</span>` : ''}<b>${esc(m.text)}</b><span class="y">Ваш ответ: ${esc(m.yours)}</span><span class="r">Правильно: ${esc(m.right)}</span></li>`).join('')}</ul></section>` : ''}
    <button class="btn" type="button" data-act="retest">Ещё раз</button>
  </div>`;
}

/* ===================== НАВИГАЦИЯ ===================== */
function render(resetScroll) {
  document.querySelectorAll('.tab').forEach(b => b.setAttribute('aria-current', b.dataset.tab === state.tab ? 'page' : 'false'));
  const top = main.scrollTop;
  if (state.tab === 'basics') renderBasics();
  else if (state.tab === 'stem') view.stem ? renderStem() : renderStemList();
  else if (state.tab === 'hemi') view.hemi ? renderHemi() : renderHemiList();
  else renderTest();
  main.scrollTop = resetScroll ? 0 : top;
}
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const d = el.dataset;
  switch (d.act) {
    case 'tab':
      if (state.tab === d.tab) { if (d.tab === 'stem') view.stem = null; if (d.tab === 'hemi') view.hemi = null; }
      state.tab = d.tab; saveStore(); render(true); break;
    case 'stem': view.stem = d.id; render(true); break;
    case 'hemi': view.hemi = d.id; view.hemiView = null; render(true); break;
    case 'back': if (state.tab === 'stem') view.stem = null; else view.hemi = null; render(true); break;
    case 'side': state.sideLeft = d.v === 'L'; saveStore(); render(); break;
    case 'hv': view.hemiView = d.v; render(); break;
    case 'ov': view.overview = d.v; render(); break;
    case 'ans':
      if (test.pick === null) {
        const q = test.qs[test.i];
        test.pick = Number(d.k);
        if (q.opts[test.pick] === q.right) test.score++;
        else {
          const tmp = document.createElement('div'); tmp.innerHTML = q.caseHtml;
          test.mistakes.push({ caseText: tmp.textContent.trim(), text: q.text, yours: q.opts[test.pick], right: q.right });
        }
        render();
      }
      break;
    case 'explain': {
      const ex = test.qs[test.i].explain;
      if (ex.t === 'stem') { state.tab = 'stem'; view.stem = ex.id; }
      else { state.tab = 'hemi'; view.hemi = ex.id; view.hemiView = null; state.sideLeft = ex.left; }
      saveStore(); render(true); break;
    }
    case 'next': test.i++; test.pick = null; render(true); break;
    case 'retest': buildTest(); render(true); break;
  }
});
render(true);
</script>
