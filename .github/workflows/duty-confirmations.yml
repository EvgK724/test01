# Fixed owner-approved count-only reader; no Sheets credentials stored in GitHub.
name: Duty confirmations
on:
  workflow_dispatch:
  schedule:
    - cron: '13,28,43,58 * * * *'
permissions:
  contents: read
concurrency:
  group: duty-confirm-main
  cancel-in-progress: false
jobs:
  confirm:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install test dependency
        run: python -m pip install -r dezhurstva/tools/pdf-requirements.txt
      - name: Check implementation contracts
        run: |
          python -m unittest discover -s dezhurstva/tools -p test_auto_confirm.py
          python -m unittest discover -s dezhurstva/tools -p test_publication_guard.py
          python -m unittest discover -s dezhurstva/tools -p test_pages_release.py
          python -m unittest discover -s dezhurstva/tools -p test_digest_parity.py
          python -m unittest discover -s dezhurstva/tools -p test_approval_revision.py
          node dezhurstva/tools/test_aggregator.cjs
          node --test dezhurstva/tools/test_ack_transport.mjs
          python dezhurstva/tools/test_flow.py
      - name: Check actual current-version declarations
        env:
          ENDPOINT: https://script.google.com/macros/s/AKfycbyPVbO5m9z6-xk0pMVXdk0rQ7pbocB2CAuB-GEmJNu_r4wDPvXXuLFDrHZj1E92iNw1/exec
        run: |
          set -euo pipefail
          git rev-parse HEAD > "$RUNNER_TEMP/source-sha"
          python dezhurstva/tools/auto_confirm.py --endpoint "$ENDPOINT" --apply > "$RUNNER_TEMP/confirmation-result.json"
          python - <<'PY'
          import json,os,pathlib
          r=json.loads(pathlib.Path(os.environ['RUNNER_TEMP'],'confirmation-result.json').read_text())
          if r['lateObjections']:
              with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:
                  f.write('## Требуется проверка организатора\n')
                  for x in r['lateObjections']: f.write(f"Окончательный график {x['month']}: получены новые данные, единогласие больше не подтверждено. График не изменён.\n")
              print('Late objection/review required. Publishing notice without changing final roster.')
          PY
      - name: Build when aggregate changed
        run: |
          set -euo pipefail
          if git diff --quiet -- dezhurstva/data/schedule.json; then exit 0; fi
          python dezhurstva/tools/build_confirmations.py --base "$(cat "$RUNNER_TEMP/source-sha")"
          python dezhurstva/tools/publication_guard.py --base "$(cat "$RUNNER_TEMP/source-sha")"
          git -c core.whitespace=cr-at-eol diff --check
      - name: Commit only guarded changes
        run: |
          set -euo pipefail
          SOURCE="$(cat "$RUNNER_TEMP/source-sha")"
          git fetch origin main
          test "$SOURCE" = "$(git rev-parse origin/main)" || { echo 'main changed; retry entire check'; exit 1; }
          if ! git diff --quiet; then
            python dezhurstva/tools/publication_guard.py --base "$SOURCE"
            git add -- dezhurstva/data/schedule.json dezhurstva/index.html dezhurstva/cal dezhurstva/files
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Update received duty declarations and finalization snapshot'
            git push origin HEAD:main
          fi
      - name: Repair or verify existing whole-site Pages deployment
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python dezhurstva/tools/pages_release.py --commit "$(git rev-parse HEAD)" --if-needed
      - name: Deliver owner-approved drafts through the existing queue
        if: vars.DUTY_OWNER_RUNNER_ENABLED == 'true'
        env:
          DUTY_OWNER_RUNNER_ENABLED: ${{ vars.DUTY_OWNER_RUNNER_ENABLED }}
          DUTY_OWNER_SOURCE_SHA: ${{ vars.DUTY_OWNER_SOURCE_SHA }}
          DUTY_OWNER_READER_URL: ${{ secrets.DUTY_OWNER_READER_URL }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python -B dezhurstva/tools/owner_bridge/runner.py
