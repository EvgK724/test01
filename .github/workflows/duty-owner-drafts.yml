# Approved-only durable queue; no timing guarantee from GitHub schedule.
name: Owner-approved duty drafts
on:
  workflow_dispatch:
  schedule:
    - cron: '7,22,37,52 * * * *'
permissions:
  contents: read
concurrency:
  group: duty-confirm-main
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/main' && vars.DUTY_OWNER_RUNNER_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r dezhurstva/tools/pdf-requirements.txt
      - name: Deliver only approved drafts and verify exact Pages release
        env:
          DUTY_OWNER_RUNNER_ENABLED: ${{ vars.DUTY_OWNER_RUNNER_ENABLED }}
          DUTY_OWNER_SOURCE_SHA: ${{ vars.DUTY_OWNER_SOURCE_SHA }}
          DUTY_OWNER_READER_URL: ${{ secrets.DUTY_OWNER_READER_URL }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python -B dezhurstva/tools/owner_bridge/runner.py
