# Делает записи голосом Microsoft Ryan для каждого приложения, в котором есть tools/make_audio.py
# (want-you-to, noun-prepositions, …), и коммитит их в ту же ветку.
# Запускается при изменении фраз или вручную.
name: Ryan voice audio

on:
  push:
    paths:
      - '*/index.html'
      - '*/tools/**'
      - '.github/workflows/ryan-audio.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ryan-audio-${{ github.ref }}
  cancel-in-progress: false

jobs:
  audio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install edge-tts
        run: pip install edge-tts==7.2.8

      - name: Generate audio (en-GB-RyanNeural) for every app
        run: |
          for script in */tools/make_audio.py; do
            dir="${script%/tools/make_audio.py}"
            echo "::group::$dir"
            node "$dir/tools/extract_phrases.mjs"
            python "$script"
            git add "$dir/audio" "$dir/phrases.json"
            echo "::endgroup::"
          done

      - name: Commit audio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          if git diff --cached --quiet; then
            echo "Audio is up to date"
            exit 0
          fi
          git commit -m "Generate Microsoft Ryan audio"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
