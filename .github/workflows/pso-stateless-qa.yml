name: PSO stateless synthetic QA only
on:
  push:
    branches: [qa/pso-stateless-r5]
permissions:
  contents: read
concurrency:
  group: pso-stateless-qa-r5
  cancel-in-progress: false
jobs:
  synthetic:
    if: github.ref == 'refs/heads/qa/pso-stateless-r5'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          sparse-checkout: qa/stateless-ci
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install PDF parser only
        run: python -m pip install pypdf==6.21.4
      - name: Verify reviewed stateless synthetic artifact
        run: python qa/stateless-ci/verify.py
