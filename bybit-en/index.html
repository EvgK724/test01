<style>
/* Раскладка: шапка, прокручиваемый экран, нижняя панель под большой палец. Тёмная тема — основная. */
:root {
  --bg: #06060B; --surface: #0E0F17; --border: #23253A;
  --text: #EEEEF8; --text-2: #A7ABC2;
  --neon: #3BE8FF; --neon-2: #FF4FD8;
  --start-fill: #062530; --start-accent: #3BE8FF; --start-text: #BDF7FF;
  --accounts-fill: #0A1533; --accounts-accent: #5B8CFF; --accounts-text: #C9D8FF;
  --spot-fill: #06261A; --spot-accent: #39FF88; --spot-text: #B8FFD7;
  --deriv-fill: #2B1206; --deriv-accent: #FF7A2F; --deriv-text: #FFD4B8;
  --risk-fill: #2B0A0E; --risk-accent: #FF4D5E; --risk-text: #FFC3C9;
  --earn-fill: #2A2208; --earn-accent: #FFD166; --earn-text: #FFE9AD;
  --security-fill: #1A0E33; --security-accent: #B08CFF; --security-text: #DED0FF;
  --about-fill: #2B0A26; --about-accent: #FF4FD8; --about-text: #FFC6F2;
  --neutral-fill: #1A1C22; --neutral-accent: #9AA0B5; --neutral-text: #D5D8E2;
  --ok: #8FD19A; --ok-fill: #17331D; --bad: #F09A90; --bad-fill: #451C1A;
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --serif: Georgia, "Times New Roman", serif;
  --k: 1;
  color-scheme: dark;
}
.g-start { --f: var(--start-fill); --a: var(--start-accent); --t: var(--start-text); }
.g-accounts { --f: var(--accounts-fill); --a: var(--accounts-accent); --t: var(--accounts-text); }
.g-spot { --f: var(--spot-fill); --a: var(--spot-accent); --t: var(--spot-text); }
.g-deriv { --f: var(--deriv-fill); --a: var(--deriv-accent); --t: var(--deriv-text); }
.g-risk { --f: var(--risk-fill); --a: var(--risk-accent); --t: var(--risk-text); }
.g-earn { --f: var(--earn-fill); --a: var(--earn-accent); --t: var(--earn-text); }
.g-security { --f: var(--security-fill); --a: var(--security-accent); --t: var(--security-text); }
.g-about { --f: var(--about-fill); --a: var(--about-accent); --t: var(--about-text); }
.g-neutral { --f: var(--neutral-fill); --a: var(--neutral-accent); --t: var(--neutral-text); }

*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html {
  font-size: calc(110% * var(--k));
  height: 100%;
  padding: env(safe-area-inset-top, 0px) 0 env(safe-area-inset-bottom, 0px);
  background: var(--bg);
  -webkit-text-size-adjust: 100%;
  -webkit-tap-highlight-color: transparent;
}
body {
  margin: 0; height: 100%;
  display: flex; flex-direction: column;
  overflow: hidden;
  background: var(--bg); color: var(--text);
  font: 600 1.125rem/1.45 var(--sans);
}
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, [tabindex]:focus-visible, summary:focus-visible { outline: 2px solid var(--text); outline-offset: 2px; }
h1, h2, h3, p { margin: 0; }
h1, h2, h3 { text-wrap: balance; }
i { font-style: italic; }
.wrap { width: 100%; max-width: 560px; margin-inline: auto; }

/* Шапка */
.top {

}

const $ = s => document.querySelector(s);

function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
// _латынь_ → курсив
function fmt(s) { return esc(s).replace(/_([^_]+)_/g, '<i>$1</i>'); }
function shuffle(a) {
  a = a.slice();
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}
function pick(arr, n, except) { return shuffle(arr.filter(x => !except.includes(x))).slice(0, n); }
const reduceMotion = () => window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------- Шрифт ---------- */
// iPad: приложение на всю ширину и крупнее (как в «Английском B2»), телефон — как есть.
// Портрет — по ширине экрана, альбом — по высоте, чтобы карточка и кнопки помещались.
function deviceK() {
  const w = window.innerWidth || 390, h = window.innerHeight || 760;
  if (w < 700) return 1;
  const k = (w >= 900 && w / h > 1.15) ? h / 600 : Math.min(w / 440, h / 780);
  return Math.max(1, Math.min(k, 1.9));
}
function applyFont() {
  document.documentElement.classList.toggle('wide', (window.innerWidth || 390) >= 700);
  document.documentElement.style.setProperty('--k', (state.settings.font / 100 * deviceK()).toFixed(3));

}

let ruVoice = null;
function initVoices() {
  try {
    if (!('speechSynthesis' in window)) return;
    const vs = speechSynthesis.getVoices(); const v = vs.find(v => /^en[-_]US/i.test(v.lang)) || vs.find(v => /^en/i.test(v.lang));
    ruVoice = v || null;
    document.body.classList.toggle('has-voice', !!ruVoice);
    if (!$('#sheet').hidden) renderSettings();
  } catch (e) {}
}
function speak(text) {
  if (!ruVoice) return;
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = ruVoice.lang || 'en-US'; u.voice = ruVoice;
    speechSynthesis.speak(u);
  } catch (e) {}
}

/* ---------- Интервальное повторение ---------- */
const IV = [1, 3, 7, 16];
const DAY = 864e5;
function today0() { const d = new Date(); d.setHours(0, 0, 0, 0); return d.getTime(); }
function rec(id) { const r = state.srs[id]; return r && typeof r.step === 'number' && IV[r.step] ? r : null; }
function isDue(id) { const r = rec(id); return !r || r.due <= Date.now(); }
function isLearned(id) { const r = rec(id); return !!r && IV[r.step] >= 7; }
function rate(id, grade) { // 0 — не знаю, 1 — почти, 2 — знаю
  const r = rec(id);
  let step;
  if (grade === 2) step = r ? Math.min(r.step + 1, IV.length - 1) : 1;
  else if (grade === 1) step = r ? r.step : 0;
  else step = 0;
  state.srs[id] = { step, due: today0() + IV[step] * DAY };
  saveStore();
}

function deckIds(deck) { return deck === 'all' ? ALL.map(m => m.id) : GROUP[deck].members.map(m => m.id); }
function startSession(deck, all) {
  const ids = deckIds(deck);
  const queue = shuffle(all ? ids : ids.filter(isDue));
  cards = { deck, queue, flipped: false, total: queue.length, all: !!all };
}
function nextDueText(deck) {
  const ts = deckIds(deck).map(id => rec(id)).filter(Boolean).map(r => r.due);
  if (!ts.length) return '';
  const days = Math.round((Math.min(...ts) - today0()) / DAY);
  if (days <= 1) return 'Next cards: tomorrow.';
  return `Next cards: in ${days} days.`;
}
function renderCards() {
  if (!cards) startSession('all', false);

        </div>
      </div></div>
    </div>

    <div class="rate">
      <button class="no" type="button" data-act="rate" data-g="0">Don’t know</button>
      <button type="button" data-act="rate" data-g="1">Almost</button>

  }
  const left = cards.queue.length;
  main.innerHTML = `<div class="wrap cards">
    <div class="chip-wrap"><div class="chips" role="group" aria-label="Deck">${chips}</div>
    <p class="meta">${left ? `Left in session: ${left}` : '&nbsp;'}</p></div>

}
function fitCard() {
  // Карточка не короче своего текста: иначе текст пришлось бы листать внутри неё, а это сбивает свайп
  const card = document.getElementById('flip');
  if (!card) return;
  card.style.minHeight = '';
  // Считаем по сумме блоков: у центрированного текста scrollHeight занижен
  const need = Math.max(...Array.from(card.querySelectorAll('.face'), f => {
    const cs = getComputedStyle(f), kids = Array.from(f.children);
    return kids.reduce((s, k) => s + k.offsetHeight, 0) + Math.max(0, kids.length - 1) * (parseFloat(cs.rowGap) || 0)
      + parseFloat(cs.paddingTop) + parseFloat(cs.paddingBottom) + parseFloat(cs.borderTopWidth) + parseFloat(cs.borderBottomWidth) + 2;
  }));
  if (need > card.offsetHeight) card.style.minHeight = Math.ceil(need) + 'px';
}
const longWord = s => String(s).length > 16 || Math.max(...String(s).split(/[\s\-—]+/).map(w => w.length)) >= 11;
function flipCard() {
  if (!cards || !cards.queue.length) return;
  cards.flipped = !cards.flipped;
  const fi = $('#flipIn');
  if (fi) {
    fi.classList.toggle('flipped', cards.flipped);
    fi.querySelector('.f-front').setAttribute('aria-hidden', String(cards.flipped));
    fi.querySelector('.f-back').setAttribute('aria-hidden', String(!cards.flipped));
  }
  if (cards.flipped && state.settings.speak) speak(BY_ID[cards.queue[0]].name);
}
function answerCard(grade) {
  if (!cards || !cards.queue.length) return;
  const id = cards.queue.shift();
  rate(id, grade);
  if (grade === 0) cards.queue.splice(Math.min(cards.queue.length, 2 + (Math.random() < .5 ? 0 : 1)), 0, id);
  cards.flipped = false;
  renderCards();
}
function bindSwipe() {
  const card = $('#flip'), mover = $('#flipMove');
  if (!card) return;
  let sx = 0, sy = 0, dx = 0, drag = false, down = false, pid = null;
  const tagY = $('#tagYes'), tagN = $('#tagNo');
  const setTags = x => { tagY.style.opacity = Math.max(0, Math.min(1, x / 90)); tagN.style.opacity = Math.max(0, Math.min(1, -x / 90)); };
  card.addEventListener('pointerdown', e => {
    if (e.target.closest('button')) return;
    down = true; drag = false; sx = e.clientX; sy = e.clientY; dx = 0; pid = e.pointerId;
  });
  card.addEventListener('pointermove', e => {
    if (!down || e.pointerId !== pid) return;
    dx = e.clientX - sx; const dy = e.clientY - sy;
    if (!drag && Math.abs(dx) > 10 && Math.abs(dx) > Math.abs(dy)) {
      drag = true; try { card.setPointerCapture(pid); } catch (err) {}
      mover.style.transition = 'none';
    }
    if (drag) { mover.style.transform = `translateX(${dx}px) rotate(${dx / 25}deg)`; setTags(dx); }
  });
  const end = e => {
    if (!down || e.pointerId !== pid) return;
    down = false;
    if (!drag) { if (e.type === 'pointerup' && !e.target.closest('button')) flipCard(); return; }
    if (Math.abs(dx) > 90 && e.type === 'pointerup') {
      const grade = dx > 0 ? 2 : 0;
      if (reduceMotion()) { answerCard(grade); return; }
      mover.style.transition = 'transform .18s ease-out';
      mover.style.transform = `translateX(${(dx > 0 ? 1 : -1) * window.innerWidth}px) rotate(${dx > 0 ? 12 : -12}deg)`;
      setTimeout(() => answerCard(grade), 180);
    } else {
      mover.style.transition = 'transform .2s ease';
      mover.style.transform = '';
      setTags(0);
    }
  };
  card.addEventListener('pointerup', end);
  card.addEventListener('pointercancel', end);
  card.addEventListener('keydown', e => {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); flipCard(); }
    else if (e.key === 'ArrowRight') answerCard(2);
    else if (e.key === 'ArrowLeft') answerCard(0);
  });
}

/* ---------- Тест ---------- */
const N_QUESTIONS = 10;
function makeQ(spec) {
  const { t } = spec;
  if (t === 5) {
    const g = spec.g;
    const right = g.members.map(m => m.name);
    let opts;
    do { opts = shuffle(right); } while (opts.join() === right.join());
    return { kind: 'order', text: `Put in order: ${esc(g.name)}`, note: 'Tap the items in the right order.', opts, right, rightText: right.join(' → ') };
  }
  const m = spec.m;
  const names = ALL.map(x => x.name), meanings = ALL.map(x => x.meaning);
  if (t === 1) return choice(`Which term means “${fmt(m.meaning)}”?`, m.name, pick(names, 3, [m.name]));
  if (t === 2) return choice(`${esc(m.name)} — which section?`, m.g.name, pick(GROUPS.map(g => g.name), 3, [m.g.name]));
  if (t === 3) return choice(`${esc(m.name)} means…`, m.meaning, pick(meanings, 3, [m.meaning]));
  return choice(`Which term fits: ${fmt(m.clue)}`, m.name, pick(names, 3, [m.name]));
}
function choice(text, right, wrong) {
  const opts = shuffle([right, ...wrong.filter((w, i, a) => w !== right && a.indexOf(w) === i)]);
  return { kind: 'choice', text, opts, right, rightText: right };
}
function buildTest() {
  const pool = [];
  ALL.forEach(m => [1, 2, 3, 4].forEach(t => pool.push({ t, m })));
  GROUPS.filter(g => g.ordered).forEach(g => pool.push({ t: 5, g }));
  const oneOfEach = [1, 2, 3, 4, 5].map(t => shuffle(pool.filter(q => q.t === t))[0]).filter(Boolean);
  const rest = shuffle(pool.filter(q => !oneOfEach.includes(q))).slice(0, N_QUESTIONS - oneOfEach.length);
  test = { qs: shuffle([...oneOfEach, ...rest]).map(makeQ), i: 0, answered: false, picks: [], mistakes: [], score: 0 };
}
function renderTest() {
  if (!test) buildTest();
  if (test.i >= test.qs.length) return renderResult();
  const q = test.qs[test.i];
  const a = test.answered;
  let opts;
  if (q.kind === 'choice') {
    opts = q.opts.map((o, k) => {
      let cls = '';
      if (a) { if (o === q.right) cls = 'ok'; else if (test.picks[0] === k) cls = 'bad'; }
      return `<button class="opt ${cls}" type="button" data-act="ans" data-k="${k}"${a ? ' disabled' : ''}>${fmt(o)}</button>`;
    }).join('');
  } else {
    opts = q.opts.map((o, k) => {
      const pos = test.picks.indexOf(k);
      let cls = pos >= 0 ? 'sel' : '';
      if (a) cls = q.right[pos] === o ? 'ok' : 'bad';
      return `<button class="opt ${cls}" type="button" data-act="ord" data-k="${k}"${a || pos >= 0 ? ' disabled' : ''}><span class="n">${pos >= 0 ? pos + 1 : ''}</span>${esc(o)}</button>`;
    }).join('');
  }
  let fb = '';
  if (a) {
    const ok = isRight(q);
    fb = ok ? `<p class="fb ok">✓ Correct</p>` : `<p class="fb bad">✗ Wrong. <span>Correct answer: ${fmt(q.rightText)}</span></p>`;
  }
  const last = test.i === test.qs.length - 1;
  main.innerHTML = `<div class="wrap stack">
    <div class="qhead"><span>Question ${test.i + 1} of ${test.qs.length}</span><span>Correct: ${test.score}</span></div>
    <div class="bar" aria-hidden="true"><b style="width:${(test.i + (a ? 1 : 0)) / test.qs.length * 100}%"></b></div>
    <p class="qtext">${q.text}</p>
    ${q.note && !a ? `<p class="qnote">${q.note}</p>` : ''}
    <div class="opts">${opts}</div>
    ${fb}
    ${a ? `<button class="btn" type="button" data-act="next">${last ? 'Result' : 'Next'}</button>` : ''}
  </div>`;
}
function isRight(q) {
  if (q.kind === 'choice') return q.opts[test.picks[0]] === q.right;
  return test.picks.map(k => q.opts[k]).join('|') === q.right.join('|');
}
function finishAnswer() {
  const q = test.qs[test.i];
  test.answered = true;
  if (isRight(q)) test.score++;
  else {
    const yours = q.kind === 'choice' ? q.opts[test.picks[0]] : test.picks.map(k => q.opts[k]).join(' → ');
    test.mistakes.push({ text: q.text, yours, right: q.rightText });
  }
  renderTest();
}
function renderResult() {
  const n = test.qs.length;
  const verdict = test.score === n ? 'Perfect — not a single mistake.' : test.score >= 7 ? 'Good result.' : 'Review the cards and try again.';
  const list = test.mistakes.length ? `<section class="mist"><h2 class="eyebrow">Mistakes</h2><ul>${test.mistakes.map(m =>
    `<li><span class="q">${m.text}</span><span class="y">Your answer: ${fmt(m.yours)}</span><span class="r">Correct answer: ${fmt(m.right)}</span></li>`).join('')}</ul></section>` : '';
  main.innerHTML = `<div class="wrap stack">
    <div class="score"><span class="num">${test.score} of ${n}</span><p>${verdict}</p></div>
    ${list}
    <button class="btn" type="button" data-act="retest">Try again</button>
  </div>`;
}

/* ---------- Настройки ---------- */
function seg(name, cur, items) {
  return `<div class="seg" role="group">${items.map(([v, l]) =>
    `<button type="button" data-act="set" data-k="${name}" data-v="${v}" aria-pressed="${String(cur) === String(v)}">${l}</button>`).join('')}</div>`;
}
function renderSettings() {
  const s = state.settings;
  const sh = $('#sheet');
  const voice = ruVoice
    ? seg('speak', s.speak, [['true', 'On'], ['false', 'Off']]) + '<p class="note">The term is read aloud when the card flips.</p>'
    : '<p class="note">This device has no English voice, so there are no 🔊 buttons.</p>';
  const reset = settingsUI.confirmReset
    ? `<p class="note">All cards will become new again. This cannot be undone.</p>
       <div class="row2"><button class="btn ghost" type="button" data-act="reset-cancel">Cancel</button>
       <button class="btn danger fill" type="button" data-act="reset-yes">Reset</button></div>`
    : `<button class="btn ghost danger" type="button" data-act="reset">Reset progress</button>`;
  sh.innerHTML = `<button class="sheet-bg" type="button" data-act="close" aria-label="Close settings" tabindex="-1"></button>
    <div class="sheet-panel" role="dialog" aria-modal="true" aria-labelledby="setTitle">
      <div class="sheet-top"><h2 id="setTitle">Settings</h2><button class="icon-btn" type="button" data-act="close" aria-label="Close" id="setClose">✕</button></div>
      <div class="field"><span class="eyebrow">Text size</span>${seg('font', s.font, [[100, '100 %'], [115, '115 %'], [130, '130 %']])}</div>
      <div class="field"><span class="eyebrow">Auto speech</span>${voice}</div>
      <div class="field"><span class="eyebrow">Progress</span>${reset}</div>
    </div>`;
}
function openSettings() { settingsUI.confirmReset = false; renderSettings(); $('#sheet').hidden = false; const c = $('#setClose'); if (c) c.focus(); }
function closeSettings() { $('#sheet').hidden = true; }

/* ---------- Навигация ---------- */
function render(resetScroll) {
  document.querySelectorAll('.tab').forEach(b => b.setAttribute('aria-current', b.dataset.tab === state.tab ? 'page' : 'false'));
  const top = main.scrollTop;
  if (state.tab === 'groups') view.group ? renderGroup() : renderGroups();
  else if (state.tab === 'cards') renderCards();
  else if (state.tab === 'test') renderTest();
  else renderStory();
  main.scrollTop = resetScroll ? 0 : top;
}

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el || !el.dataset.act) return;
  const act = el.dataset.act, d = el.dataset;
  switch (act) {
    case 'tab':
      if (state.tab === d.tab && d.tab === 'groups') view.group = null;
      state.tab = d.tab; saveStore(); render(true); break;
    case 'group': view.group = d.id; view.quiz = false; view.open = {}; render(true); break;
    case 'back': view.group = null; render(true); break;
    case 'quiz': view.quiz = !view.quiz; view.open = {}; render(); break;
    case 'reveal': view.open[d.key] = !view.open[d.key]; render(); break;
    case 'speak': e.stopPropagation(); speak(d.say); break;
    case 'deck': startSession(d.id, false); render(); break;
    case 'again': startSession(cards.deck, true); render(); break;
    case 'rate': answerCard(Number(d.g)); break;
    case 'ans': if (!test.answered) { test.picks = [Number(d.k)]; finishAnswer(); } break;
    case 'ord':
      if (!test.answered && !test.picks.includes(Number(d.k))) {
        test.picks.push(Number(d.k));
        if (test.picks.length === test.qs[test.i].opts.length) finishAnswer(); else renderTest();
      }
      break;
    case 'next': test.i++; test.answered = false; test.picks = []; render(true); break;
    case 'retest': buildTest(); render(true); break;
    case 'settings': openSettings(); break;
    case 'close': closeSettings(); break;
    case 'set': {
      let v = d.v;
      if (d.k === 'font') v = Number(v);
      if (d.k === 'speak') v = v === 'true';
      state.settings[d.k] = v; saveStore(); applyFont(); renderSettings(); break;
    }
    case 'reset': settingsUI.confirmReset = true; renderSettings(); break;
    case 'reset-cancel': settingsUI.confirmReset = false; renderSettings(); break;
    case 'reset-yes':
      state.srs = {}; saveStore(); cards = null; settingsUI.confirmReset = false;
      renderSettings(); render(); break;
  }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('#sheet').hidden) closeSettings(); });

applyFont();
render(true);
initVoices();
try { if ('speechSynthesis' in window && speechSynthesis.addEventListener) speechSynthesis.addEventListener('voiceschanged', initVoices); } catch (e) {}
</script>
<script>
/* ---------- Автообновление: при открытии и при возврате в приложение сверяем код страницы с версией на сайте ---------- */
(function () {
  if (location.protocol !== 'https:' || window.parent !== window) return;
  const KEY = 'app-update:' + location.pathname;
  const ss = {
    get(k) { try { return sessionStorage.getItem(k); } catch (e) { return null; } },
    set(k, v) { try { sessionStorage.setItem(k, v); } catch (e) {} }
  };
  const texts = doc => Array.from(doc.querySelectorAll('script, style'), n => n.textContent);
  const hash = list => { let h = 5381; const s = list.join('\n'); for (let i = 0; i < s.length; i++) h = (h * 33 + s.charCodeAt(i)) | 0; return (h >>> 0) + ':' + s.length; };
  const mine = new Set(texts(document));
  let last = 0, box = null;
  // Не перезагружаем посреди теста — тогда только предлагаем обновиться
  function busy() {
    try { return state.tab === 'test' && !!test && test.i < test.qs.length && (test.i > 0 || !!test.answered || test.pick != null); } catch (e) { return false; }
  }
  function toast(text, onUpdate) {
    if (box) box.remove();
    box = document.createElement('div');
    box.setAttribute('role', 'status');
    box.style.cssText = 'position:fixed;z-index:60;left:12px;right:12px;top:calc(env(safe-area-inset-top, 0px) + 64px * var(--k, 1));max-width:520px;margin:0 auto;display:flex;align-items:center;gap:8px;padding:6px 6px 6px 16px;border-radius:14px;background:var(--surface, #0E0F17);color:var(--text, #EEEEF8);border:1px solid var(--neon, #3BE8FF);box-shadow:0 0 18px -5px var(--neon, #3BE8FF);font-size:1rem;font-weight:600;min-height:56px';
    const label = document.createElement('span');
    label.style.flex = '1';
    label.textContent = text;
    box.append(label);
    const btn = (t, fn, extra) => {
      const b = document.createElement('button');
      b.type = 'button'; b.textContent = t;
      b.style.cssText = 'min-width:44px;min-height:44px;border-radius:10px;border:0;font:inherit;padding:0 12px;cursor:pointer;' + extra;
      b.addEventListener('click', fn);
      box.append(b);
    };
    if (onUpdate) {
      btn('Update', onUpdate, 'background:var(--neon, #3BE8FF);color:#06060B');
      btn('✕', () => box.remove(), 'background:none;color:inherit');
      box.querySelector('button').setAttribute('aria-label', 'Update the app');
      box.lastChild.setAttribute('aria-label', 'Dismiss');
    } else {
      setTimeout(() => box && box.remove(), 2500);
    }
    document.body.append(box);
  }
  function apply(fresh) {
    ss.set(KEY, fresh);
    ss.set(KEY + ':done', '1');
    location.reload();
  }
  async function check() {
    if (Date.now() - last < 60000) return;
    last = Date.now();
    try {
      const r = await fetch(location.href.split('#')[0], { cache: 'reload' });
      if (!r.ok) return;
      const list = texts(new DOMParser().parseFromString(await r.text(), 'text/html'));
      if (!list.length || list.every(t => mine.has(t))) return;
      const fresh = hash(list);
      // Уже перезагружались ради этой версии, а пришла старая — не зацикливаемся, предлагаем кнопку
      if (busy() || ss.get(KEY) === fresh) toast('A new version is available', () => apply(fresh));
      else apply(fresh);
    } catch (e) {}
  }
  if (ss.get(KEY + ':done')) { ss.set(KEY + ':done', ''); toast('App updated'); }
  setTimeout(check, 1500);
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') check(); });
  window.addEventListener('pageshow', e => { if (e.persisted) check(); });
})();
</script>
